[project]
name = "transaction-monitoring"
version = "0.0.1"
description = "Transaction Monitoring System"
authors = [
    {name = "MehranMzn", email = "Mehran@mzn.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
    "python-dotenv",
    "pandas",
    "numpy",
    "kaggle",
    "pymongo[srv]==3.11",
    "certifi",
    "scikit-learn",
    "pyyaml",
    "mlflow",
    "dagshub",
    "fastapi",
    "uvicorn",
    "pre-commit",
    "apache-airflow==2.7.0",
    "apache-airflow-providers-sqlite",
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pre-commit",
]
